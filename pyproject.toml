[project]
name = "fruit-dl"
version = "1.1.0"
description = "植物病蟲害智慧辨識系統 - 基於 DINOv3 (ViT Large) 深度學習模型"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "NPUST DN-LAB", email = "noreply@example.com" }
]

dependencies = [
    "torch==2.9.1",
    "torchvision==0.24.1",
    "timm>=1.0.20",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "altair>=5.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.9",
    "tqdm>=4.65.0",
    "PyYAML>=6.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "httpx>=0.28.1",
    "aiosqlite>=0.22.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.black]
line-length = 100
target-version = ['py310', 'py311']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[dependency-groups]
dev = [
    "black>=25.11.0",
    "flake8>=7.3.0",
    "pytest>=9.0.1",
]
